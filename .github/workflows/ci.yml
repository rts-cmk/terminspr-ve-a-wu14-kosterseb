name: CI

on:
  pull_request:
    branches: [development, master]
  push:
    branches: [development]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nightclub/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: nightclub
      - name: Run ESLint
        run: npm run lint
        working-directory: nightclub

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nightclub/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: nightclub
      # Also type-checks: next build fails on TypeScript errors.
      # No API needed — the pages that fetch are dynamic, so nothing runs at build time.
      - name: Build
        run: npm run build
        working-directory: nightclub
