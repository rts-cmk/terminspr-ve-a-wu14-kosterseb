name: CI

on:
  pull_request:
    branches: [development, master]
  push:
    branches: [development]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nightclub/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: nightclub
      - name: Run ESLint
        run: npm run lint
        working-directory: nightclub

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nightclub/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: nightclub
      # Catches nothing the other jobs do: they both pass on badly formatted code.
      - name: Check formatting
        run: npm run format:check
        working-directory: nightclub

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nightclub/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: nightclub
      # Also type-checks: next build fails on TypeScript errors.
      # No API needed — the pages that fetch are dynamic, so nothing runs at build time.
      - name: Build
        run: npm run build
        working-directory: nightclub

  api:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API dependencies
        run: npm ci
        working-directory: api
      - name: Start the API
        run: nohup npm start &
        working-directory: api
      - name: Wait for the API to answer
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:4000/events > /dev/null; then
              echo "API is up after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "API did not start within 30s"
          exit 1
      # Lint and build both pass while db.json is malformed; this does not.
      - name: Check the API still answers with the shapes the app reads
        run: npm run test:api
